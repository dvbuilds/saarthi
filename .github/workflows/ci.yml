name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: Backend — syntax check & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        working-directory: ./Backend
        run: npm ci

      # No ESLint config exists in Backend yet — `node --check` is an
      # honest stand-in that catches actual syntax errors, which is what
      # was manually run against every file in this project throughout
      # development. Swap this for `npm run lint` once ESLint is added.
      - name: Syntax check all source files
        working-directory: ./Backend
        run: |
          find . -name "*.js" -not -path "./node_modules/*" -print0 \
            | xargs -0 -n1 node --check

      - name: Run tests
        working-directory: ./Backend
        run: npm test

  frontend:
    name: Frontend — lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./Frontend
        run: npm ci

      - name: Lint
        working-directory: ./Frontend
        run: npm run lint

      - name: Build
        working-directory: ./Frontend
        run: npm run build

  docker-build:
    name: Docker — verify images build
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4

      # Builds the image to prove the Dockerfile is actually valid — does
      # NOT push anywhere or deploy. Catches "the Dockerfile is broken"
      # before it becomes a production surprise.
      - name: Build backend image
        run: docker build -t saarthi-backend:ci ./Backend

  # ── Load test ────────────────────────────────────────────────────────
  # Only runs when manually triggered (Actions tab → this workflow → Run
  # workflow), not on every push/PR — spinning up the full Mongo+Redis+
  # API+Worker stack and hammering it for real takes minutes and can be
  # flaky on shared CI runners, which makes it a bad gate for routine
  # commits. This is a genuinely runnable job though, not a placeholder —
  # it builds and starts the real docker-compose stack and runs the same
  # loadtest/run.js script used for local benchmarking.
  loadtest:
    name: Load test (manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Create a minimal .env for the stack to boot
        run: |
          cat > Backend/.env << EOF
          JWT_SECRET=ci-loadtest-secret
          JWT_REFRESH_SECRET=ci-loadtest-refresh-secret
          GROQ_API_KEY=ci-placeholder
          FRONTEND_URL=http://localhost:5173
          EOF

      - name: Start the stack
        run: docker compose up -d --build api worker mongo redis

      - name: Wait for the API to become healthy
        run: |
          for i in {1..20}; do
            curl -sf http://localhost:5000/health && exit 0
            sleep 3
          done
          echo "API never became healthy — dumping logs"
          docker compose logs api
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run load test against the live stack
        working-directory: ./Backend
        run: |
          npm ci
          BASE_URL=http://localhost:5000 DURATION=10 CONNECTIONS=20 node loadtest/run.js

      - name: Tear down
        if: always()
        run: docker compose down -v


  # Deliberately left as a documented placeholder rather than a fake step
  # that pretends to deploy without actually being wired to anything.
  # This project currently deploys via Render (backend) and Vercel
  # (frontend) directly from git pushes, not through this pipeline.
  #
  # To make this real:
  #   1. Add a repo secret RENDER_DEPLOY_HOOK_URL (Render dashboard →
  #      service → Settings → Deploy Hook).
  #   2. Add a job here that does:
  #        - run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
  #   3. After triggering, poll your live /health endpoint until it
  #      returns 200 before considering the deploy successful:
  #        - run: |
  #            for i in {1..10}; do
  #              curl -sf https://your-backend.onrender.com/health && exit 0
  #              sleep 10
  #            done
  #            exit 1
  # Left undone here because it needs secrets only you have access to —
  # wiring it up incorrectly without real credentials would be worse than
  # leaving it documented.
